services:
  app:
    image: breezyvoice:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      - MODEL_PATH=/breezyvoice/models/BreezyVoice
      - HF_HOME=/breezyvoice/.hf-cache
      - PYTHONUTF8=1
    volumes:
      - /home/beback46/models/BreezyVoice:/breezyvoice/models/BreezyVoice:ro
    command: api.py
    init: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
